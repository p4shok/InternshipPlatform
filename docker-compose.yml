services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: student-it-platform-frontend-dev
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-it-platform-frontend-prod
    ports:
      - "3000:80"

volumes:
  frontend_node_modules:
